[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispersion-for-retail"
version = "0.1.0"
description = "Mega-cap call dispersion: backtest and execution layer (tastytrade retail / prime-broker institutional)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "pyarrow>=15", "yfinance>=0.2.50", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["dispersion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
